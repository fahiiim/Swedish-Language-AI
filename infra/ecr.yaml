AWSTemplateFormatVersion: "2010-09-09"
Description: Immutable ECR repository for the Swedish Language AI service.

Parameters:
  RepositoryName:
    Type: String
    Default: swedish-language-ai
    AllowedPattern: "[a-z0-9]+(?:[._/-][a-z0-9]+)*"

Resources:
  ContainerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref RepositoryName
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Remove untagged images after seven days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {"type": "expire"}
              },
              {
                "rulePriority": 2,
                "description": "Keep the newest 30 release images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["sha-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 30
                },
                "action": {"type": "expire"}
              }
            ]
          }
      Tags:
        - Key: Application
          Value: swedish-language-ai

Outputs:
  RepositoryArn:
    Value: !GetAtt ContainerRepository.Arn
  RepositoryUri:
    Value: !GetAtt ContainerRepository.RepositoryUri
  RepositoryName:
    Value: !Ref ContainerRepository
