name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: swedish-language-ai

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest

      - name: Build container
        run: >-
          docker build
          --build-arg BUILD_VERSION=${GITHUB_SHA::12}
          --build-arg BUILD_REVISION=${GITHUB_SHA}
          --tag ${IMAGE_NAME}:test
          .

      - name: Smoke-test container on port 8005
        run: |
          trap 'docker rm --force swedish-language-ai-test >/dev/null 2>&1 || true' EXIT
          docker run --detach --read-only --tmpfs /tmp:size=16m \
            --name swedish-language-ai-test \
            --publish 8005:8000 \
            "${IMAGE_NAME}:test"
          for attempt in {1..12}; do
            if curl --fail --silent http://127.0.0.1:8005/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs swedish-language-ai-test
          exit 1

  deploy:
    name: Deploy to EC2
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: swedish-language-ai-production
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      APP_PORT: ${{ secrets.APP_PORT || '8005' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate deployment secrets
        run: |
          test -n "$EC2_HOST" || { echo "Missing secret EC2_HOST"; exit 1; }
          test -n "$EC2_USER" || { echo "Missing secret EC2_USER"; exit 1; }
          test -n "$EC2_SSH_PRIVATE_KEY" || { echo "Missing secret EC2_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Missing secret AWS_ACCESS_KEY_ID"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing secret AWS_SECRET_ACCESS_KEY"; exit 1; }
          [[ "$APP_PORT" =~ ^[0-9]+$ ]] || { echo "APP_PORT must be numeric"; exit 1; }

      - name: Build release image
        run: |
          docker build \
            --build-arg "BUILD_VERSION=${GITHUB_SHA::12}" \
            --build-arg "BUILD_REVISION=$GITHUB_SHA" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" | gzip > "/tmp/${IMAGE_NAME}-${GITHUB_SHA}.tar.gz"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Prepare application environment
        run: |
          umask 077
          {
            printf 'APP_ENV=production\n'
            printf 'AWS_ACCESS_KEY_ID=%s\n' "$AWS_ACCESS_KEY_ID"
            printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$AWS_SECRET_ACCESS_KEY"
            printf 'AWS_REGION=%s\n' "$AWS_REGION"
            printf 'BEDROCK_MODEL_ID=amazon.nova-lite-v1:0\n'
            printf 'BEDROCK_CONNECT_TIMEOUT_SECONDS=5\n'
            printf 'BEDROCK_READ_TIMEOUT_SECONDS=60\n'
            printf 'DOCS_ENABLED=false\n'
            printf 'LOG_LEVEL=INFO\n'
          } > "/tmp/${IMAGE_NAME}-${GITHUB_SHA}.env"

      - name: Upload image to EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            "/tmp/${IMAGE_NAME}-${GITHUB_SHA}.tar.gz" \
            "/tmp/${IMAGE_NAME}-${GITHUB_SHA}.env" \
            "${EC2_USER}@${EC2_HOST}:/tmp/"

      - name: Replace container and verify health
        run: |
          ssh -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" \
            "APP_PORT='$APP_PORT' IMAGE_TAG='${IMAGE_NAME}:${GITHUB_SHA}' ARCHIVE_PATH='/tmp/${IMAGE_NAME}-${GITHUB_SHA}.tar.gz' ENV_SOURCE_PATH='/tmp/${IMAGE_NAME}-${GITHUB_SHA}.env' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          container_name="swedish-language-ai"
          env_file="/opt/swedish-language-ai/.env"
          previous_image="$(sudo docker inspect --format '{{.Config.Image}}' "$container_name" 2>/dev/null || true)"

          sudo install -d -m 700 /opt/swedish-language-ai
          sudo install -m 600 "$ENV_SOURCE_PATH" "$env_file"
          rm --force "$ENV_SOURCE_PATH"

          gzip --decompress --stdout "$ARCHIVE_PATH" | sudo docker load
          sudo docker rm --force "$container_name" >/dev/null 2>&1 || true

          run_container() {
            sudo docker run --detach \
              --name "$container_name" \
              --restart unless-stopped \
              --read-only \
              --tmpfs /tmp:size=16m,mode=1777 \
              --env-file "$env_file" \
              --publish "${APP_PORT}:8000" \
              "$1"
          }

          run_container "$IMAGE_TAG"

          for attempt in {1..12}; do
            if curl --fail --silent "http://127.0.0.1:${APP_PORT}/health"; then
              rm --force "$ARCHIVE_PATH"
              exit 0
            fi
            sleep 5
          done

          sudo docker logs "$container_name"
          sudo docker rm --force "$container_name" >/dev/null 2>&1 || true
          if [[ -n "$previous_image" ]]; then
            echo "Deployment failed; restoring $previous_image"
            run_container "$previous_image"
          fi
          exit 1
          REMOTE_SCRIPT

      - name: Verify public endpoint
        run: |
          curl --fail --show-error --silent \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --max-time 10 "http://${EC2_HOST}:${APP_PORT}/health"
